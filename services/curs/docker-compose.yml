services:
  curs:
    build:
      context: ./app
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 256M
    cpus: 1
    env_file:
      - .env
    environment:
      - PORT=8083
      - MYSQL_ROOT_PASSWORD=secret
      - DBNAME=curs
    ports:
      - "0.0.0.0:8083:8083"
    networks:
      - cursnet
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:9.4
    restart: unless-stopped
    mem_limit: 1024M
    cpus: 1  
    volumes:
      - ./db/:/var/lib/mysql
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=curs
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cursnet
  
networks:
  cursnet:
    name: cursnet
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

