<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Авторизация</title>

    <link href="/../../static/bootstrap.css" rel="stylesheet">
    <link href="/../../static/style.css" rel="stylesheet">
    <link href="/../../static/3-col-portfolio.css" rel="stylesheet">
  </head>


  <body>

    <nav class="navbar navbar-fixed-top navbar-inverse" role="navigation">
      <div class="container">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-ex1-collapse">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse navbar-ex1-collapse">
          <ul class="nav navbar-nav">
          <li><a href="/">Главная</a></li>
            <li><a href="/user/register">Регистрация</a></li>
            <li class="active"><a href="/user/login"><b>Авторизация</b></a></li>
          </ul>
        </div>
      </div>
    </nav>
 
    <div class="container">
      <h1>Авторизация</h1>

      <div class="panel panel-default col-sm-6">
        <div class="panel-body">
          <form class="form" action="/user/login" method="POST">
            <div class="form-group">
              <label for="login">Имя</label>
              <input type="text" class="form-control" required="required" id="login" name="login" placeholder="Имя пользователя">
            </div>
            <div class="form-group">
              <label for="password">Пароль</label>
              <input type="password" name="password" required="required" class="form-control" id="password" placeholder="Пароль">
            </div>
            <button type="submit" class="btn btn-primary">Авторизация</button>
          </form>
          <div id="message-container">
            {{ if .error }}
                {{ .error | safeHTML }}
            {{ end }}
        
           {{ if .message }}
                {{ .message | safeHTML }}
            {{ end }}
         </div>
        </div>
      </div>
    </div> 
  </body> 
</html>
